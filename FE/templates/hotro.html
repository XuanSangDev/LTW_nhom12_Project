<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>NEU Learning Hub - Trung tâm hỗ trợ người học</title>

    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
              },
              colors: {
                brand: {
                  navy: '#0A1128',
                  sidebar: '#0B132B',
                  sidebarActive: '#152238',
                  sidebarHover: '#131e33',
                  hero: '#0B132B',
                  orange: '#F57C00',
                  orangeHover: '#E65100',
                  subtleBg: '#F8FAFC',
                }
              }
            }
          }
        }
    </script>

    <!-- Link đến file CSS riêng -->
    <link rel="stylesheet" href="hotro.css">
</head>
<body class="bg-[#F8FAFC] text-slate-800 font-sans antialiased min-h-screen flex flex-row selection:bg-orange-100 selection:text-orange-900">

    <!-- BEGIN: Sidebar -->
    <aside class="w-64 bg-[#0A1128] text-slate-300 flex-shrink-0 flex flex-col justify-between border-r border-slate-800 min-h-screen" data-purpose="main-sidebar">
        <div>
            <!-- Brand Logo Header -->
            <div class="px-5 py-5 flex items-center gap-3 border-b border-slate-800/60">
                <div class="w-9 h-9 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center">
                    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3P_atGfMAC2rrJ9-dansIrYUUkE1MF_t6bsNIHucLWlRP_t2JWGhvnBITmhr16cifAvMacKE6oIt4wReEH43wFtDP0m6zfITyeqiFPH7Juw-lWe78PUbtl_CipU_JmRwb1NDHeQ4_ick6MaFQttnlZVkqP1Cc1VbVgahyunDPXeScYq_tSAxatsvscl9XJ2tKiuS_Xz3iOVOwaYt9hjFhgHhQwmlzCXMUir-l6WvWIaSaF2zxLTqF5A" alt="NEU Learning Hub Logo" class="w-full h-full object-cover rounded-xl">
                </div>
                <div>
                    <div class="text-white font-bold text-sm tracking-tight leading-snug">NEU Learning Hub</div>
                    <div class="text-[11px] text-slate-400 font-normal">Đại học Kinh tế Quốc dân</div>
                </div>
            </div>

            <!-- Navigation Section -->
            <nav class="px-3 py-4 space-y-1">
                <div class="px-3 pt-2 pb-2 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                    PHÂN HỆ HỌC VỤ
                </div>
                <!-- Academic Resource Menu Item -->
                <a class="flex items-center justify-between px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-[#131e33] transition-colors text-xs font-medium group" href="#">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-book-open text-slate-400 group-hover:text-slate-300 text-sm"></i>
                        <span class="">Học liệu &amp; Tài nguyên</span>
                    </div>
                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-500 group-hover:text-slate-400"></i>
                </a>
                <!-- Learning Analytics Menu Item -->
                <a class="flex items-center justify-between px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-[#131e33] transition-colors text-xs font-medium group" href="#">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-chart-simple text-slate-400 group-hover:text-slate-300 text-sm"></i>
                        <span class="">Phân tích học tập</span>
                    </div>
                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-500 group-hover:text-slate-400"></i>
                </a>
               <!-- Group Item: Hỗ trợ người học (Expanded / Màn hình Trung tâm) -->


<!-- MENU HỖ TRỢ NGƯỜI HỌC -->
<div class="w-full">
    <!-- Nút Hỗ trợ người học: bấm để thu gọn/mở rộng -->
    <button
        type="button"
        onclick="toggleSupportMenu()"
        id="supportToggle"
        aria-expanded="true"
        class="w-full bg-[#152238] rounded-2xl p-2.5 flex items-center gap-3 border border-blue-500/20 shadow-sm hover:bg-[#1c304d] transition-all">

        <div class="w-9 h-9 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400 flex-shrink-0">
            <i class="fa-solid fa-headset text-base"></i>
        </div>

        <span class="text-white font-semibold text-xs tracking-tight flex-1 text-left">
            Hỗ trợ người học
        </span>

        <i id="supportArrow"
           class="fa-solid fa-chevron-up text-[10px] transition-transform duration-300">
        </i>
    </button>

    <!-- Menu con -->
    <div id="supportSubmenu"
         class="mt-2 ml-3 pl-5 border-l border-slate-700 space-y-1">

        <a href="{{ url_for('guihotro') }}">Gửi yêu cầu hỗ trợ</a>
        <a href="{{ url_for('myhotro') }}">Yêu cầu của tôi</a>
        <a href="{{ url_for('chitiet') }}">Chi tiết yêu cầu</a>
        <a href="{{ url_for('faq') }}">FAQ &amp; Hướng dẫn</a>
    </div>
</div>


            </nav>
        </div>

        <!-- Bottom Sidebar Controls -->
        <div class="p-3 border-t border-slate-800/70 space-y-1">
            <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-[#131e33] transition-colors text-xs font-medium" href="#">
                <i class="fa-solid fa-gear text-slate-400 text-sm"></i>
                <span class="">Cài đặt</span>
            </a>
            <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 transition-colors text-xs font-medium" href="#">
                <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
                <span class="">Đăng xuất</span>
            </a>
        </div>
    </aside>
    <!-- END: Sidebar -->

    <!-- BEGIN: Main Body Area -->
    <div class="flex-1 flex flex-col min-w-0">
       <!-- BEGIN: TopBar -->
        <header class="h-16 bg-white border-b border-slate-200/80 px-8 flex items-center justify-between flex-shrink-0" data-purpose="app-header">
            <!-- Search Input -->
            <div class="relative w-80">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input class="w-full pl-9 pr-4 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-full focus:outline-none focus:ring-1 focus:ring-blue-500 focus:bg-white text-slate-700 placeholder-slate-400" placeholder="Tìm kiếm học phần, cảnh báo" type="text">
            </div>

            <!-- Right Profile & Notification Controls -->
            <div class="flex items-center gap-5">
                <!-- Notification Bell -->
                <button class="relative p-1.5 text-slate-500 hover:text-slate-700 transition-colors" title="Thông báo">
                    <i class="fa-regular fa-bell text-lg"></i>
                    <span class="absolute top-0.5 right-0.5 w-4 h-4 bg-red-500 text-white rounded-full text-[10px] font-bold flex items-center justify-center border-2 border-white leading-none">2</span>
                </button>

                <!-- User Information -->
                <div class="flex items-center gap-3 pl-2">
                    <div class="w-8 h-8 rounded-full bg-slate-900 text-white font-semibold text-xs flex items-center justify-center tracking-tight shadow-sm">
                        NA
                    </div>
                    <span class="text-xs font-semibold text-slate-800">Nguyễn Văn An</span>
                </div>
            </div>
        </header>
        <!-- END: TopBar -->


    </div>
    <!-- END: Main Body Area -->
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
